name: Feature request
description: Something the server should do, or a screen it should read better
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        For a new front end, or a transaction or app the server cannot work in, use "New surface or transaction" instead. Leave real SAP data out.
  - type: textarea
    id: need
    attributes:
      label: What you want to do
      description: The task in SAP, and where the server stops you today.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      multiple: true
      options:
        - SAP GUI for Windows (scripting)
        - SAP GUI for Windows, network reader (SAP_GUI_METHOD=diag)
        - Web GUI (SAP GUI for HTML)
        - Fiori
        - Record and replay, or export
        - Command line (setup, doctor, sessions)
        - Documentation
        - Other
  - type: textarea
    id: idea
    attributes:
      label: How it could work
      description: An action, a setting, a change to the view. Optional.
  - type: textarea
    id: safety
    attributes:
      label: Effect on the write guard
      description: Could this let an action write to SAP? How should SAP_WRITE treat it?
  - type: checkboxes
    id: scrubbed
    attributes:
      label: Data
      options:
        - label: I removed business data, host names and personal data from what I pasted.
          required: true
