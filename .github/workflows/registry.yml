name: MCP Registry

# Publishes server.json to the official MCP Registry for a version already on npm
# (release.yml does this too; this runs it again on its own).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registry:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # mcp-publisher login github-oidc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Publish to the MCP Registry
        env:
          MCP_PUBLISHER_VERSION: v1.8.9
        run: bash .github/scripts/mcp-registry.sh
