name: Release

# Runs only when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0).
# The tag must be on main and equal "v" + the version in package.json and server.json.
# npm trusted publishing (OIDC): npm trusts this workflow and its "npm" environment, so
# there is no npm token anywhere. Then the server is listed in the official MCP Registry
# (server.json) and the Claude Desktop extension (.mcpb) is attached to a GitHub release.
on:
  push:
    tags: ["v*"]

# Two jobs: "build" installs, tests and builds with read-only rights and no secret;
# "publish" only takes what build made and publishes it, with the rights that needs.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: The tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: The tag matches the package version
        id: version
        shell: bash
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $version (expected v$version)"
            exit 1
          fi
          for v in "$(node -p 'require("./server.json").version')" "$(node -p 'require("./server.json").packages[0].version')"; do
            if [ "$v" != "$version" ]; then
              echo "::error::server.json says $v, package.json $version: set both to the release version"
              exit 1
            fi
          done
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
      - name: The built command runs on plain Node
        run: node dist/cli.js --version

      # Everything that will be published is built before anything is published.
      - name: Pack the npm tarball
        run: npm pack
      - name: Build the Claude Desktop bundle (.mcpb)
        run: bun run build:mcpb
      - name: Collect release assets
        shell: bash
        run: |
          mkdir -p release-assets
          # npm pack and scripts/build-mcpb.mjs both write to the repository root.
          mv "sap-ui-automation-$VERSION.tgz" "sap-ui-automation-$VERSION.mcpb" release-assets/
          # The same bundle under one name for every version: releases/latest/download/sap-ui-automation.mcpb.
          cp "release-assets/sap-ui-automation-$VERSION.mcpb" release-assets/sap-ui-automation.mcpb
          ls -l release-assets
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: release-assets/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Settings > Environments > npm: its required reviewers approve every publish. npm's trusted
    # publisher for this package names this workflow and this environment.
    environment: npm
    permissions:
      contents: write # create the GitHub release and upload its assets
      id-token: write # npm trusted publishing and provenance
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: release-assets
      - name: The assets are the ones build made
        shell: bash
        run: |
          ls -l release-assets
          test -f "release-assets/sap-ui-automation-$VERSION.tgz"
          test -f "release-assets/sap-ui-automation-$VERSION.mcpb"
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@11

      # Publishes exactly the tarball attached to the release below (lifecycle scripts do not run
      # for a tarball; it was built and tested by the build job). Trusted publishing: no token.
      - name: Publish to npm
        shell: bash
        run: |
          tag=latest
          case "$VERSION" in *-*) tag=next ;; esac
          # "./" makes it a file: npm 11 reads "release-assets/x.tgz" as the GitHub repository release-assets/x.
          npm publish "./release-assets/sap-ui-automation-$VERSION.tgz" --provenance --access public --tag "$tag"

      - name: Create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$VERSION" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "${prerelease[@]}"

  # The official MCP Registry: server.json, proven by this repository's OIDC token (namespace
  # io.github.DidroAI) and by "mcpName" in the package just published. Never fatal: the npm
  # release stands; registry.yml runs it again on its own.
  registry:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    permissions:
      contents: read
      id-token: write # mcp-publisher login github-oidc
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Publish to the MCP Registry
        env:
          MCP_PUBLISHER_VERSION: v1.8.9
        run: bash .github/scripts/mcp-registry.sh
